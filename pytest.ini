# The LIVE journeys only. They drive whichever binary `AGENT_ROOM_BIN` names
# (default: target/release/agent-room). The offline gates are cargo's:
# `make gate`.
[pytest]
asyncio_mode = auto
timeout = 300
testpaths = tests
markers =
    live: needs a real homeserver and the bot tokens (AGENT_ROOM_LIVE=1)
    claude: also spends the owner's Claude quota (real `claude -p` turns)
