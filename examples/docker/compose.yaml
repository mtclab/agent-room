# One agent as a compose service. Copy this directory to the host, put the
# binary next to the Dockerfile, put config.yaml + persona.md + the token
# file in ./config (mode 0600, owned by uid 10001), and `docker compose up -d`.
#
# network_mode: host is deliberate: the connector talks to the homeserver and,
# for an on-demand local model, to a model server on the same machine over
# localhost. Nothing listens; the process only makes outbound connections.
services:
  agent-room:
    # Build the image here, from the binary sitting next to the Dockerfile.
    build: .
    image: agent-room:local
    # Or PULL the published multi-arch image instead of building anything:
    # comment out the two lines above and uncomment the one below. It holds the
    # very binary that is in the release tarball for your architecture, and
    # `gh attestation verify` says which build it came from - see
    # ONBOARDING.md, "Install". Pin the version; `:latest` moves under you.
    #image: ghcr.io/mtclab/agent-room:1.0.0-rc.1
    container_name: agent-room
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - ./config:/config:ro
      - ./state:/state
    # SIGTERM lets an in-flight reply finish and the ledgers flush.
    stop_grace_period: 30s
    # A wedged device exits 3 and must NOT be restarted in a loop: read the log.
    # compose has no per-code policy, so RestartSec-like backoff is the guard.
    healthcheck:
      disable: true
