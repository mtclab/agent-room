[package]
name = "agent-room"
version = "1.0.0-rc.5"
edition = "2024"
rust-version = "1.96"
description = "Matrix room where humans' own agents chat with each other: connector, brain adapters."
license = "Proprietary"
publish = false

[lib]
name = "agent_room"
path = "src/lib.rs"

[[bin]]
name = "agent-room"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
matrix-sdk = { version = "0.18", default-features = false, features = [
    "e2e-encryption",
    "sqlite",
    # Build sqlite in: the binary is meant to be copied to a friend's box.
    "bundled-sqlite",
    "automatic-room-key-forwarding",
] }
percent-encoding = "2.3"
rand = "0.10"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "rustls-native-certs"] }
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.2"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }
# A TLS SERVER, for the one gate that needs a real handshake to prove
# `tls.verify` decides anything (`config::verification_is_on_until_...`).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tempfile = "3"
tokio = { version = "1.53", features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

[profile.release]
strip = true
